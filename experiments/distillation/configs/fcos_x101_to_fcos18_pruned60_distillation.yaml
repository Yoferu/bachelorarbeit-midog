experiment_name: fcos_x101_to_fcos18_pruned60_distillation
output_dir: experiments/distillation/runs
teacher:
  architecture: fcos_x101
  checkpoint: repos/FCOS_Inference_CLI/checkpoints/FCOS_x101.ckpt
  freeze: true
  pretrained_backbone: false
  init_mode: checkpoint
  eval_config: experiments/eval_guide/configs/FCOS_x101_eval.yaml
  num_classes: 2
  patch_size: 1024
  det_thresh: 0.05
  weights: null
  returned_layers:
    - 1
    - 2
    - 3
    - 4
  extra_blocks: false
student:
  architecture: fcos18_depgraph_fpn_head_60pct
  checkpoint: experiments/pruning/models/FCOS_18_depgraph_fpn_head_60pct.pt
  freeze: false
  pretrained_backbone: false
  init_mode: structural_checkpoint
  eval_config: experiments/eval_guide/configs/FCOS_18_eval.yaml
  num_classes: 2
  patch_size: 1024
  det_thresh: 0.05
  weights: null
  returned_layers:
    - 1
    - 2
    - 3
    - 4
  extra_blocks: false
data:
  train_csv: data/midogpp_guide_eval_xvalidation.csv
  val_csv: null
  image_root: data/midogpp
  dataset_type: midog_guide
  box_format: cxcy
  domain_col: tumortype
  num_train_samples: 1024
  num_val_samples: 128
  fg_prob: 0.5
  arb_prob: 0.25
  guide_repo: repos/MIDOG_2025_Guide
training:
  epochs: 20
  batch_size: 2
  num_workers: 4
  lr: 0.0001
  weight_decay: 0.0001
  seed: 42
  device: cuda
  max_batches_per_epoch: null
  optimizer: AdamW
  deterministic: false
  gradient_clip_val: 1.0
  gradient_accumulation_steps: 1
distillation:
  enabled: true
  temperature: 2.0
  lambda_supervised: 1.0
  lambda_cls: 0.5
  lambda_box: 0.25
  lambda_centerness: 0.25
  match_outputs: true
  skip_mismatched_shapes: true
logging:
  save_every: 1
  evaluate_every: 0
  log_interval: 10
