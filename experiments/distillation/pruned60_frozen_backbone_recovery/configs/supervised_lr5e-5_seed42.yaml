experiment_name: supervised_lr5e-5_seed42
output_dir: experiments/distillation/pruned60_frozen_backbone_recovery/runs
teacher: null
student:
  architecture: fcos18_depgraph_fpn_head_60pct
  checkpoint: experiments/pruning/models/FCOS_18_depgraph_fpn_head_60pct.pt
  freeze: false
  pretrained_backbone: false
  init_mode: structural_checkpoint
  eval_config: experiments/eval_guide/configs/FCOS_18_eval.yaml
  num_classes: 2
  patch_size: 1024
  det_thresh: 0.05
  weights: null
  returned_layers:
  - 1
  - 2
  - 3
  - 4
  extra_blocks: false
data:
  train_csv: experiments/distillation/pruned60_clean_recovery/data/train_seed42.csv
  val_csv: experiments/distillation/pruned60_clean_recovery/data/validation_seed42.csv
  calibration_csv: experiments/distillation/pruned60_clean_recovery/data/calibration_seed42.csv
  final_csv: data/midogpp_guide_eval_xvalidation.csv
  final_split: test
  image_root: data/midogpp
  dataset_type: midog_guide
  box_format: cxcy
  domain_col: tumortype
  num_train_samples: 1024
  num_val_samples: 128
  fg_prob: 0.5
  arb_prob: 0.25
  guide_repo: repos/MIDOG_2025_Guide
training:
  epochs: 1
  batch_size: 2
  num_workers: 4
  lr: 5.0e-05
  weight_decay: 0.0001
  seed: 42
  device: cuda
  max_batches_per_epoch: null
  optimizer: AdamW
  deterministic: true
  gradient_clip_val: 1.0
  gradient_accumulation_steps: 1
  freeze_backbone: true
  early_stopping:
    enabled: true
    metric: validation_ap
    mode: max
    min_epochs: 1
    patience_evaluations: 5
    min_delta: 0.0001
    validation_interval_steps: 25
    restore_best_checkpoint: false
    validation_device: cuda
    validation_batch_size: 1
    validation_num_workers: 4
    validation_det_thresh: 0.584
    validation_nms_thresh: 0.3
    validation_overlap: 0.3
    validation_config_file: experiments/eval_guide/configs/FCOS_18_eval.yaml
    validation_adapter: src/benchmark/midog_guide_adapter.py
    validation_split: val
  aggressive_lr_safety_stop:
    enabled: false
  numerical_safety:
    enabled: true
    max_gradient_norm: 1000.0
distillation:
  enabled: false
  temperature: 2.0
  lambda_supervised: 1.0
  lambda_cls: 0.0
  lambda_box: 0.0
  lambda_centerness: 0.0
  match_outputs: true
  skip_mismatched_shapes: true
logging:
  save_every: 1
  evaluate_every: 0
  log_interval: 10
  save_every_steps: 25
  checkpoint_steps:
  - 0
