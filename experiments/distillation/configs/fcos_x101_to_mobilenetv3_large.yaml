experiment_name: fcos_x101_to_mobilenetv3_large
output_dir: experiments/distillation/runs

teacher:
  architecture: fcos_x101
  checkpoint: repos/FCOS_Inference_CLI/checkpoints/FCOS_x101.ckpt
  freeze: true
  pretrained_backbone: false
  init_mode: checkpoint
  num_classes: 2
  patch_size: 1024
  det_thresh: 0.05

student:
  architecture: fcos_mobilenetv3_large_fpn
  checkpoint: null
  pretrained_backbone: true
  init_mode: imagenet
  num_classes: 2
  patch_size: 1024
  det_thresh: 0.05

data:
  train_csv: data/midogpp_guide_eval_xvalidation.csv
  val_csv: null
  image_root: data/midogpp
  dataset_type: midog_guide
  box_format: cxcy
  domain_col: tumortype
  num_train_samples: 1024
  num_val_samples: 128
  fg_prob: 0.5
  arb_prob: 0.25
  guide_repo: repos/MIDOG_2025_Guide

training:
  epochs: 20
  batch_size: 2
  num_workers: 4
  lr: 0.0001
  weight_decay: 0.0001
  seed: 123
  device: auto
  max_batches_per_epoch: null

distillation:
  enabled: true
  temperature: 2.0
  lambda_supervised: 1.0
  lambda_cls: 0.5
  lambda_box: 0.25
  lambda_centerness: 0.25
  match_outputs: true
  skip_mismatched_shapes: true

logging:
  save_every: 1
  evaluate_every: 0
  log_interval: 10

